name: Vendo arquivos compartilhados entre Jobs

on:
  push:
    branches:
      - main

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do Ubuntu
        run: cat /etc/os-release

      - name: Exibir uma mensagem
        run: echo "Github Actions" > ${{ github.workspace }}/mensagem.txt

      - name: Ver o conteudo do diretorio
        run: pwd && ls -lah
      
      - uses: actions/upload-artifact@v4
        with:
          name: strigus-upload
          path: ${{ github.workspace }}/mensagem.txt

  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Ver o conteudo do diretorio
        run: ls -lah && pwd 
      
      - uses: actions/download-artifact@v4
        with:
          name: strigus-upload
          path: strigus
      
      - name: Ver o conteudo do diretorio
        run: ls -lah && pwd && ls -lah ./strigus/

      - name: Move e remove
        run: mv strigus/mensagem.txt . && rm -rf .strigus
        
      - name: Ver o conteudo do diretorio
        run: ls -lah  
        
      - name: Le conteudo do arquivo
        run: cat mensagem.txt