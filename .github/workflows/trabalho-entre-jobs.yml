name: Vendo arquivos compartilhados entre Jobs

on:
  push:
    branches:
      - main

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do Ubuntu
        run: cat /etc/os-release

      - name: Exibir uma mensagem
        run: echo "Github Actions" > mensagem.txt
      
      - uses: actions/upload-artifact@v4
        with:
          name: strigus
          path: /home/ubuntu/mensagem.txt

  job_2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strigus
          path: mensagem.txt
      
      - name: Ver o conteudo do diretorio
        run: ls -lah && ls ./strigus/
        
      - name: Mover arquivos
        run: mv strigus/mensagem.txt . $$ rm -rf ./strigus

      - name: Ver o conteudo do diretorio
        run: ls -lah

      - name: Le conteudo do arquivo
        run: cat mensagem.txt